# =============================================
# AI Resume Integrity Checker - Configuration
# =============================================

# Server port (open browser at http://localhost:8080)
server.port=8080

# App name shown in browser tab
spring.application.name=AI Resume Checker

# ⚠️  IMPORTANT: Paste your Claude API key below
# Get it free at: https://console.anthropic.com
claude.api.key=YOUR_CLAUDE_API_KEY_HERE

# Claude model to use
claude.model=claude-sonnet-4-20250514

# Max file upload size (5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Thymeleaf settings (auto-reload templates in dev)
spring.thymeleaf.cache=false
